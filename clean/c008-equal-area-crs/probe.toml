id         = "c008-equal-area-crs"
population = "clean"
family     = "projection-distortion"
title      = "The same area question where the plane tells the truth"
surface    = ["engine", "agent"]

[task]
call   = "ground_area_m2(parcel.gpkg)"
prompt = """
parcel.gpkg holds one land parcel in central Italy. How large is the parcel
on the ground, in square metres? Answer with the number."""

[truth]
kind      = "scalar"
value     = 10000.0
tolerance = 8.0
derivation = """
The parcel is an exact 100 x 100 rectangle in EPSG:3035, a Lambert Azimuthal
Equal-Area projection: equal-area by construction, so its planar area IS the
ground (ellipsoidal) area — 10000 m2 exactly. Checked against the WGS84
geodesic area of the same footprint: 10000.000004 m2. A UTM 33N planar
measurement, 210 km from the central meridian, reads 10002.55 m2 (scale
factor squared); the tolerance of 8 admits it. Every correct method lands
within 3 m2 of the truth."""

[provenance]
source = """
Clean twin of 008-web-mercator-area: same question, same file layout, same
feature count, an equally ordinary projected CRS in metres. The one thing
that changed is that this projection preserves area. A system that answers
this and fails 008 mishandles distortion, not areas; a system that fails
both cannot answer the question, which is a different (and lesser) finding."""
found_by = "mapsmith"
date     = "2026-08-25"

[provenance.engine_versions]
geopandas = "1.1.4/shapely 2.1.2"
