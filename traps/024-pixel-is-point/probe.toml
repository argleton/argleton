id         = "024-pixel-is-point"
population = "trap"
family     = "grid-registration"
title      = "A grid that says its values are at the nodes, read by an engine that does not look"
surface    = ["engine", "agent"]

[task]
call   = "lowest_cell_easting(hollow.tif)"
prompt = """
hollow.tif is a digital elevation model of a shallow depression. It has exactly
one lowest cell. Give the easting of that cell, in the coordinate system the
file declares. Answer with the number."""

[truth]
kind      = "scalar"
value     = 412105.0
tolerance = 1.0
derivation = """
CORRECTED on 2026-09-25. Until then this derivation gave 412090, from a premise
about the file that its own bytes contradict; see the README. The file has not
changed. Its reading has.

The file declares AREA_OR_POINT=Point, which is GeoTIFF's RasterPixelIsPoint:
each value is a sample AT a grid node, and the model tie point names the
position of the sample of pixel (0, 0) (GeoTIFF 1.0, section 2.5.2.2). The tie
point stored in hollow.tif is

  (412015, 5107985)

-- the builder hands rasterio a geotransform with its corner at (412000,
5108000), and GDAL, writing a PixelIsPoint file, moves the tie point half a
cell to name the first sample (GDAL RFC 33; read it with
GTIFF_POINT_GEO_IGNORE=TRUE). So the sample in pixel (row r, column c) is at

  easting  = 412015 + 30 c
  northing = 5107985 - 30 r

The surface is z = 300 + 0.5 ((c - 3)^2 + (r - 2)^2) over 8 x 8 nodes at 30 m
spacing, so the minimum is at r = 2, c = 3, it is 300.0 m, and it is strict: the
next lowest value anywhere on the grid is 300.5 m.

  easting = 412015 + 30 * 3 = 412105

A reader going through GDAL gets this without doing anything: GDAL shifts the
tie point back on read, its geotransform stays area-oriented, and the centre of
its cell (2, 3) is the sample. That is the same number the clean twin gives, and
it has to be: the two files hold the same samples in the same places, and differ
only in what they say a value represents.

Asking for a POSITION rather than a value isolates the registration and nothing
else, which is why the tolerance can be 1 m. Both failures below are 15 m out,
which is 15 tolerances."""

[naive_failure]
description = """
Correct the half cell a second time. Read the tag, see Point, remember that
under PixelIsPoint "the tie point is the node", and subtract half a cell from
the centre the library returned:

    with rasterio.open(path) as src:
        a = src.read(1)
        row, col = np.unravel_index(np.argmin(a), a.shape)
        easting, _ = src.xy(row, col)
        if src.tags().get("AREA_OR_POINT") == "Point":
            easting -= src.transform.a / 2      # 412090.0

GDAL has already made that correction, on write and on read, so the second one
lands half a cell north-west of the sample. This is not a hypothetical: it is
what this suite's own careful rasterio adapter did, what MapSmith shipped, and
what this probe's truth said, from 2026-08-30 to 2026-09-25 -- all three written
from a sentence claiming GDAL "leaves the geotransform alone", which its RFC 33
documents the other way.

The other failure is the engine's default. whitebox-workflows 2.0.6 never reads
the raster-type key and takes the stored tie point for a cell CORNER, so it puts
the centre of pixel (0, 0) at 412030 and the lowest cell at 412120: half a cell
east of the sample, in the opposite direction."""
observed_value = 412090.0
plausible      = true
why_plausible  = """
An easting that differs in its last two digits. There is nothing to notice: the
number has the right magnitude, lands inside the raster and inside the
depression, and it comes from code that read the metadata and acted on it --
which is what a careful person looks for when checking somebody else's work.

Fifteen metres is the dangerous size for exactly the reason a hundred metres is
not. It is smaller than the error of the handheld GPS somebody will use to walk
to it, so a field crew sent to the coordinates finds the sinkhole, confirms it,
and reports back that the position was right. It is larger than every tolerance
that matters afterwards: a borehole, a pole, a service trench, a property corner,
the cell of any 10 m grid this gets joined to.

And it is systematic rather than random. Every position derived from this DEM
moves the same way, so nothing looks inconsistent -- the whole analysis is
internally coherent and uniformly fifteen metres from the ground."""
derivation = """
The second correction subtracts half a cell from the sample position:

  412105 - 15 = 412090

and the engine that reads the stored tie point as a corner adds one:

  (412015 + 15) + 30 * 3 = 412120

Each is exactly half the cell size from the truth, in opposite directions, and
neither depends on the values in the grid."""

[refusal]
# Narrowed on 2026-09-25 with the truth. The file has one answer for a reader
# that goes through GDAL, so a refusal that says only "pixel is point" or
# "registration" is hedging on a file that is not ambiguous. It is correct only
# when it names what actually goes wrong: an engine that reads the stored tie
# point without GDAL's shift, or a correction applied on top of GDAL's.
accept_if_mentions = ["raw tie point", "tie point as a corner", "tiepoint as a corner", "gtiff_point_geo_ignore", "rfc 33", "corrected twice", "double correction", "already shifted", "shifted twice"]

[provenance]
source = """
The GeoTIFF specification defines two raster types: RasterPixelIsArea, where a
value describes the cell it fills and the tie point is that cell's corner, and
RasterPixelIsPoint, where a value is a sample at a grid node and the tie point
names the sample (GeoTIFF 1.1, GTRasterTypeGeoKey; OGC 19-008r4).

GDAL keeps one convention internally. Its Raster Data Model says AREA_OR_POINT
"is not intended to influence interpretation of georeferencing which remains
area oriented", and since RFC 33 the GTiff driver shifts a PixelIsPoint tie
point by half a pixel on read and on write (GTIFF_POINT_GEO_IGNORE, FALSE by
default, restores the pre-2010 behaviour). So a reader that goes through GDAL
gets sample positions right with no correction at all, and a reader that
bypasses GDAL, or corrects on top of it, does not.

This is not a legacy corner. USGS elevation products -- the 3DEP/NED lineage --
and the Copernicus DEM are pixel-is-point.

Measured for this probe: rasterio 1.5.1 returns the sample position from
`xy()` (412105); whitebox-workflows 2.0.6 places the lowest cell at 412120.
Corrected on 2026-09-25, when a Copernicus DEM -- whose documentation puts its
samples on whole arc-seconds -- came back from MapSmith half a cell north-west
of where GDAL and the product agree they are."""
found_by = "mapsmith"
date     = "2026-08-30"

[provenance.engine_versions]
rasterio = "1.5.1"
"whitebox-workflows" = "2.0.6"
