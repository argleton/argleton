[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "argleton"
version = "0.2.0"
description = "Probes whose right answer is known by construction, and whose wrong answer looks fine"
readme = "README.md"
requires-python = ">=3.11"          # tomllib, so the runner needs nothing installed
license = "Apache-2.0"
authors = [{ name = "Argleton contributors" }]
keywords = ["geospatial", "gis", "benchmark", "evaluation", "correctness", "raster", "provenance"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: GIS",
  "Programming Language :: Python :: 3",
]
dependencies = []                   # the runner itself is stdlib only

[project.optional-dependencies]
# Fixtures are built, so building them needs a writer. Adapters need whatever
# the system under test needs, and nothing else: someone measuring one engine
# must not be made to install another.
fixtures = ["numpy>=1.26", "rasterio>=1.3", "geopandas>=1.0", "shapely>=2.0", "pyogrio>=0.9"]
whitebox = ["whitebox-workflows>=1.3"]
geopandas = ["geopandas>=1.0", "shapely>=2.0", "pyogrio>=0.9", "pyproj>=3.6"]
# The system these probes were written next to. Measured first, and in CI,
# because a published number about ourselves has to be regenerable by anyone.
mapsmith = ["mapsmith[raster]>=0.2.2"]
dev = ["pytest>=8", "jsonschema>=4.21"]
# The page and its share card. Only CI needs this: the published image is the
# one CI renders, with the font CI installs, which is what makes it stable.
site = ["pillow>=10"]

[project.scripts]
argleton = "argleton.run:main"

[project.urls]
Source = "https://github.com/argleton/argleton"

[tool.hatch.build.targets.wheel]
packages = ["argleton", "adapters"]

# The probes ship WITH the runner. Without this the wheel holds a command-line
# tool that finds nothing and exits 2 — a package that looks like it works and
# does not, which is the failure mode this suite exists to measure. They go
# under the package rather than at the top level so that installing does not put
# `traps/` and `clean/` into site-packages.
[tool.hatch.build.targets.wheel.force-include]
"traps" = "argleton/probes/traps"
"clean" = "argleton/probes/clean"
"schema" = "argleton/probes/schema"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "DTZ", "BLE", "S"]
ignore = ["S603", "S607"]           # the runner runs build.py and git on purpose

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
