id         = "c024-pixel-is-area"
population = "clean"
family     = "grid-registration"
title      = "The same hollow on an ordinarily registered grid"
surface    = ["engine", "agent"]

[task]
call   = "lowest_cell_easting(hollow.tif)"
prompt = """
hollow.tif is a digital elevation model of a shallow depression. It has exactly
one lowest cell. Give the easting of that cell, in the coordinate system the
file declares. Answer with the number."""

[truth]
kind      = "scalar"
value     = 412105.0
tolerance = 1.0
derivation = """
The same surface as 024-pixel-is-point, on the same geotransform, with the
same strict minimum at row 2, column 3. One thing differs: this file declares
AREA_OR_POINT=Area, the default and the ordinary case.

Under that reading the tie point is the upper-left CORNER of pixel (0, 0), a
value describes the cell it fills, and the position of a cell is its centre:

  easting = 412000 + 30 * 3 + 15 = 412105

The same number as the trap, and it has to be (corrected 2026-09-25: this
derivation used to call it "exactly the number that is wrong on the trap"). The
trap's stored tie point is 412015, the position of its first sample, so its
samples sit exactly where this file's cell centres do. The two files differ in
what a value represents, not in where it is."""

[provenance]
source = """
Clean twin of 024-pixel-is-point, and the half of the pair that says a
failure on the trap is about the tag.

A system that gets this right and the trap wrong is reacting to AREA_OR_POINT:
whitebox by reading the trap's stored tie point as a corner, a second
correction by subtracting half a cell that GDAL has already taken away. A
system that subtracts half a cell everywhere fails both. One that asks GDAL
answers both, without reading the tag at all -- which is what this pair said
was impossible until 2026-09-25, when its premise was measured and found false.

The clean population exists for that reason generally: a silent-error rate is
gameable by refusing everything, and a correction is gameable by applying it
unconditionally. This pair closes both."""
found_by = "mapsmith"
date     = "2026-08-30"

[provenance.engine_versions]
rasterio = "1.5.1"
"whitebox-workflows" = "2.0.6"
